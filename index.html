<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Chat</title>
  
<link rel="stylesheet" href="https://rabbitholedesign.github.io/sliding_phone/style.css">
  
</head>

<body>

<center>

<div id="phone">

  <div class="screen">

    <div class="lockscreen">

      <div class="lock-time">12:45</div>
      <div class="lock-date">New Orleans</div>

      <div class="weather">
        <span>🌤 18°C</span>
      </div>

      <div class="unlock">
        🔒 swipe to unlock
      </div>

    </div>

    <div class="chatui">

      <div class="statusbar">

        <span class="time">12:45</span>

        <div class="status-icons">

          <span class="signal">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>

          <span class="wifi"></span>

          <span class="battery">
            <span class="battery-fill"></span>
          </span>

        </div>

      </div>

      <div class="topbar">

        <div class="user">
          <div class="avatar"></div>
          <div class="name">Caroline 💖</div>
        </div>

        <div class="actions">
          <span class="icon phone"></span>
          <span class="icon video"></span>
          <span class="icon more"></span>
        </div>

      </div>

      <div class="chat">

        <div class="message mine">szia</div>
        <div class="message mine">mi a helyzet?</div>
        <div class="message mine">megetetted a macskát?</div>

        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

      <div class="input">Message...</div>

    </div>

  </div>

</div>

</center>

</body>
</html>
